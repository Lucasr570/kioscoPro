databases:
  - name: kiosco-db
    databaseName: kiosco_db
    user: kiosco_user
    plan: free

services:
  - type: web
    name: kiosco-backend
    env: python
    buildCommand: "bash ./backend/build.sh"
    startCommand: "cd backend && gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kiosco-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOWED_HOSTS
        value: .onrender.com

  - type: web
    name: kiosco-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./build"
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: kiosco-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
